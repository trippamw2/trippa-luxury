<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Dark variant - for light backgrounds -->
  <g>
    <!-- Decorative line above -->
    <line x1="80" y1="12" x2="320" y2="12" stroke="#C2A46D" stroke-width="1" opacity="0.5"/>
    
    <!-- KIVARA wordmark -->
    <text x="200" y="72" text-anchor="middle" font-family="'Trajan Pro','Times New Roman',Georgia,serif" font-size="44" font-weight="400" letter-spacing="10" fill="#1C1A17">KIVARA</text>
    
    <!-- Tagline -->
    <text x="200" y="96" text-anchor="middle" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="300" letter-spacing="6" fill="#8B7D6B" text-transform="uppercase">LUXURY AFRICAN TRAVEL</text>
    
    <!-- Decorative line below -->
    <line x1="80" y1="108" x2="320" y2="108" stroke="#C2A46D" stroke-width="1" opacity="0.5"/>
    
    <!-- Small diamond accent -->
    <rect x="196" y="108" width="8" height="8" fill="#C2A46D" opacity="0.4" transform="rotate(45, 200, 112)"/>
  </g>
</svg>
