<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Favicon — minimal K monogram, quiet luxury aesthetic -->
  <rect width="100" height="100" rx="0" fill="#1C1A17"/>
  <!-- Two tapered facing arcs (matching the logo symbol) -->
  <path d="M 26,34 Q 50,40 74,34 Q 50,28 26,34 Z" fill="#C2A46D" opacity="0.5"/>
  <path d="M 26,46 Q 50,40 74,46 Q 50,52 26,46 Z" fill="#C2A46D" opacity="0.3"/>
  <!-- Minimal K letterform -->
  <text x="50" y="68" text-anchor="middle" font-family="'Trajan Pro','Times New Roman',Georgia,serif" font-size="48" font-weight="400" fill="#F4F0E8">K</text>
</svg>
