<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Light variant - for dark backgrounds -->
  <g>
    <!-- Decorative line above -->
    <line x1="80" y1="12" x2="320" y2="12" stroke="#D4BC8A" stroke-width="1" opacity="0.6"/>
    
    <!-- KIVARA wordmark -->
    <text x="200" y="72" text-anchor="middle" font-family="'Trajan Pro','Times New Roman',Georgia,serif" font-size="44" font-weight="400" letter-spacing="10" fill="#F4F0E8">KIVARA</text>
    
    <!-- Tagline -->
    <text x="200" y="96" text-anchor="middle" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="8" font-weight="300" letter-spacing="6" fill="#D8CBB8" text-transform="uppercase">LUXURY AFRICAN TRAVEL</text>
    
    <!-- Decorative line below -->
    <line x1="80" y1="108" x2="320" y2="108" stroke="#D4BC8A" stroke-width="1" opacity="0.6"/>
    
    <!-- Small diamond accent -->
    <rect x="196" y="108" width="8" height="8" fill="#D4BC8A" opacity="0.5" transform="rotate(45, 200, 112)"/>
  </g>
</svg>
