<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Favicon — minimal K monogram, quiet luxury aesthetic -->
  <rect width="100" height="100" rx="0" fill="#1C1A17"/>
  <!-- Two delicate horizon lines (matching the logo symbol) -->
  <path d="M 18,38 C 35,32 65,32 82,38" stroke="#C2A46D" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 14,45 C 35,40 65,40 86,45" stroke="#C2A46D" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- Minimal K letterform -->
