<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 145" fill="none">
  <!-- Light variant — for dark backgrounds -->
  <!-- Horizon Symbol -->
  <!-- Upper curve — Warm Ivory -->
  <path d="M 80,32 C 140,22 260,22 320,32" stroke="#F4F0E8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Lower curve — Sunset Gold Light -->
  <path d="M 66,42 C 140,30 260,30 334,42" stroke="#D4BC8A" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- KIVARA wordmark — Warm Ivory -->
  <text x="200" y="88" text-anchor="middle" font-family="'Trajan Pro','Times New Roman',Georgia,serif" font-size="44" font-weight="400" fill="#F4F0E8" style="letter-spacing:16px">KIVARA</text>
  <!-- Tagline -->
  <text x="200" y="120" text-anchor="middle" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="7" font-weight="300" fill="#D8CBB8" style="letter-spacing:5px">BUSH ● BEACH ● ROMANCE</text>
