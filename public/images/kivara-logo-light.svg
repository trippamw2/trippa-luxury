<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 145" fill="none">
  <!-- Light variant — for dark backgrounds -->
  <!-- Horizon Symbol (intersecting) -->
  <!-- Upper curve — Warm Ivory — sweeps down through the lower -->
  <path d="M 70,26 C 140,44 240,18 330,28" stroke="#F4F0E8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Lower curve — Sunset Gold Light — sweeps up through the upper, crossing twice -->
  <path d="M 60,42 C 130,22 230,46 340,36" stroke="#D4BC8A" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- KIVARA wordmark — Warm Ivory — extreme wide tracking for luxury -->
  <text x="200" y="88" text-anchor="middle" font-family="'Trajan Pro','Times New Roman',Georgia,serif" font-size="44" font-weight="400" fill="#F4F0E8" style="letter-spacing:28px">KIVARA</text>
  <!-- Tagline -->
  <text x="200" y="120" text-anchor="middle" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="7" font-weight="300" fill="#D8CBB8" style="letter-spacing:5px">BUSH ● BEACH ● ROMANCE</text>
</svg>
